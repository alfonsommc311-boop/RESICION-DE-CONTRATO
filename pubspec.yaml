name: resolucion_contrato_pro
description: "Resolución de Contrato PRO - obra atrasada bajo el 80 %: programa acelerado, penalidades, intervención económica y resolución según la Ley 32069, sin internet."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  flutter_tts: ^4.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/assets/
    - assets/web/lessons/
flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1c1917"
  adaptive_icon_foreground: assets/icon/foreground.png
flutter_native_splash:
  color: "#1c1917"
  image: assets/icon/foreground.png
  android_12:
    color: "#1c1917"
    image: assets/icon/foreground.png
