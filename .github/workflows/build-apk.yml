name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['index.html', 'sw.js', 'manifest.json', 'icons/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: resolucion-obra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk resolucion-obra.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest resolucion-obra.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Resolución Obra (APK)" --prerelease \
            --notes "APK de la última compilación de la rama ${GITHUB_REF_NAME}. Descárgalo desde el celular y ábrelo para instalar."
